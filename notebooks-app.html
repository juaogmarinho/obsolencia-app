<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle de Notebooks — Fora de Garantia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --panel:#141a24; --panel-2:#171e29; --line:#232b38;
    --text:#e7ecf4; --muted:#8b96a8; --muted-2:#5d6779;
    --amber:#f0a63c; --amber-soft:#3a2c14;
    --red:#ef5b5b; --red-soft:#3a1e1e;
    --green:#4fd39a; --green-soft:#123027;
    --blue:#5b9dee; --blue-soft:#122238;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(circle at 100% 0%, rgba(91,157,238,.06), transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(240,166,60,.05), transparent 35%),
      var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}
  .mono{font-family:'IBM Plex Mono',monospace}
  header.top{display:flex;justify-content:space-between;align-items:flex-end;padding:28px 36px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:14px}
  header.top .eyebrow{color:var(--muted-2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
  header.top h1{font-size:24px;margin-top:4px}
  header.top .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  header.top .actions-primary{display:flex;gap:6px}
  header.top .actions-secondary{display:flex;gap:6px;border-left:1px solid var(--line);padding-left:8px;margin-left:2px}
  button{font-family:'Inter',sans-serif;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);padding:9px 14px;font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
  button:hover{border-color:#3a4456;background:#1b2330}
  button.primary{background:linear-gradient(135deg,#f0a63c,#e08a2c);border:none;color:#231502;font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  button.danger{color:var(--red)}
  button.ghost{background:transparent;border:1px solid transparent;color:var(--muted);font-size:12px;padding:8px 12px}
  button.ghost:hover{color:var(--text);background:var(--panel-2);border-color:var(--line)}
  label.file-input{cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:transparent;border:1px solid transparent;color:var(--muted);font-size:12px;padding:8px 12px;border-radius:8px;transition:.15s;margin:0}
  label.file-input:hover{color:var(--text);background:var(--panel-2);border-color:var(--line)}
  label.file-input input{display:none}
  @media (max-width:1200px){header.top .actions-secondary{border-left:none;padding-left:0;margin-left:0}}
  main{padding:26px 36px 60px;max-width:1400px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:26px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;transition:.2s}
  .kpi:hover{border-color:#3a4456;background:#1b2330}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--muted-2)}
  .kpi.warn::before{background:var(--red)}
  .kpi.ok::before{background:var(--green)}
  .kpi.money::before{background:var(--amber)}
  .kpi small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .kpi .val{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;margin-top:8px;letter-spacing:-.5px}
  .kpi.warn .val{color:var(--red)}
  .kpi.ok .val{color:var(--green)}
  .kpi.money .val{font-size:24px;color:var(--amber)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar input[type=text]{flex:1;min-width:180px}
  .toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'Inter',sans-serif}
  .toolbar select{cursor:pointer}
  .result-count{color:var(--muted);font-size:12px;margin:0 0 10px}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:13px}
  thead th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#131926}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
  .badge.red{background:var(--red-soft);color:var(--red)}
  .badge.green{background:var(--green-soft);color:var(--green)}
  .badge.amber{background:var(--amber-soft);color:var(--amber)}
  .badge.blue{background:var(--blue-soft);color:var(--blue)}
  .badge.grey{background:#1e2531;color:var(--muted)}
  .prio-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .prio-Alta{background:var(--red)}
  .prio-Média{background:var(--amber)}
  .prio-Baixa{background:var(--muted-2)}
  .row-actions{display:flex;gap:6px}
  .row-actions button{padding:5px 9px;font-size:12px}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .empty button{margin-top:10px}

  dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:0;width:min(640px,92vw)}
  dialog::backdrop{background:rgba(6,8,12,.7)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal-head h2{font-size:18px}
  .modal-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;max-height:65vh;overflow:auto}
  .modal-body label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
  .modal-body label.full{grid-column:1/-1}
  .modal-body input,.modal-body select,.modal-body textarea{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13px;font-family:'Inter',sans-serif}
  .modal-body textarea{resize:vertical;min-height:60px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--line)}
  .close-x{background:none;border:none;color:var(--muted);font-size:18px;padding:2px 6px}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1b2330;border:1px solid var(--line);color:var(--text);padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:700px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    main{padding:18px}
    .modal-body{grid-template-columns:1fr}
    header.top{flex-direction:column;align-items:stretch;gap:12px}
    header.top .actions{flex-direction:column}
    header.top .actions-secondary{flex-wrap:wrap;border-left:none;padding-left:0;margin-left:0}
    header.top .actions button,header.top .actions label.file-input{width:100%;justify-content:center;font-size:11px}
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <p class="eyebrow">TI · GESTÃO DE ATIVOS</p>
    <h1>Controle de Notebooks Fora de Garantia</h1>
  </div>
  <div class="actions">
    <div class="actions-secondary">
      <button class="ghost" id="downloadTemplate" title="Baixar template Excel">📥 Template</button>
      <button class="ghost" id="exportCsv" title="Exportar dados em CSV">📊 CSV</button>
      <button class="ghost" id="exportJson" title="Fazer backup em JSON">💾 Backup</button>
      <label class="file-input" title="Importar dados do Excel">
        📤 Importar Excel
        <input type="file" id="importExcel" accept=".xlsx,.xls">
      </label>
      <label class="file-input" title="Restaurar backup JSON">
        📥 Importar JSON
        <input type="file" id="importJson" accept="application/json">
      </label>
    </div>
    <button class="primary" id="addBtn">＋ Novo notebook</button>
  </div>
</header>

<main>
  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Buscar por colaborador, patrimônio ou modelo...">
    <select id="filterStatus"><option value="">Todos os status</option></select>
    <select id="filterPrio"><option value="">Todas as prioridades</option></select>
    <select id="filterWarranty">
      <option value="">Garantia: todos</option>
      <option value="Sim">Fora da garantia</option>
      <option value="Não">Em garantia</option>
    </select>
  </div>
  <p class="result-count" id="resultCount"></p>

  <table>
    <thead>
      <tr>
        <th>Colaborador</th><th>Departamento</th><th>Local</th><th>Modelo</th>
        <th>Patrimônio/Serial</th><th>Fim garantia</th><th>Garantia</th>
        <th>Status</th><th>Prioridade</th><th>Valor est.</th><th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</main>

<dialog id="formDialog">
  <form id="notebookForm">
    <div class="modal-head">
      <h2 id="formTitle">Novo notebook</h2>
      <button type="button" class="close-x" data-close>×</button>
    </div>
    <input type="hidden" id="id">
    <div class="modal-body">
      <label>Colaborador*<input id="colaborador" required></label>
      <label>E-mail (UPN)<input id="email" type="email"></label>
      <label>Departamento<input id="depto"></label>
      <label>Localização<input id="local" placeholder="Ex.: Remoto - Recife/PE"></label>
      <label>Modelo do notebook<input id="modelo"></label>
      <label>Patrimônio / Serial<input id="patrimonio"></label>
      <label>Data de compra<input id="dataCompra" type="date"></label>
      <label>Fim da garantia<input id="dataGarantia" type="date"></label>
      <label>Status
        <select id="status">
          <option>Em garantia</option>
          <option>Fora da garantia - aguardando compra</option>
          <option>Compra aprovada</option>
          <option>Novo notebook enviado</option>
          <option>Troca concluída</option>
        </select>
      </label>
      <label>Prioridade
        <select id="prioridade"><option>Alta</option><option>Média</option><option>Baixa</option></select>
      </label>
      <label>Valor estimado (R$)<input id="valor" type="number" min="0" step="0.01"></label>
      <label class="full">Observações<textarea id="obs"></textarea></label>
    </div>
    <div class="modal-actions">
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button class="primary" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
<script>
const KEY = 'notebooks-garantia-v1';
const statuses = ['Em garantia','Fora da garantia - aguardando compra','Compra aprovada','Novo notebook enviado','Troca concluída'];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dateBR = v => v ? new Intl.DateTimeFormat('pt-BR').format(new Date(v+'T12:00:00')) : '—';

let items = load();

function load(){ 
  try{ 
    const d = JSON.parse(localStorage.getItem(KEY)); 
    if(Array.isArray(d) && d.length > 0) return d;
  } catch { }
  
  // Dados de exemplo iniciais
  return [
    {id:'nb-001',colaborador:'João Silva',email:'joao.silva@empresa.com',depto:'TI',local:'Recife/PE',modelo:'Dell Inspiron 15',patrimonio:'NB-001',dataCompra:'2023-01-15',dataGarantia:'2025-01-15',status:'Fora da garantia - aguardando compra',prioridade:'Alta',valor:2500,obs:'Processa bem, requer manutenção'},
    {id:'nb-002',colaborador:'Maria Santos',email:'maria@empresa.com',depto:'RH',local:'São Paulo/SP',modelo:'Lenovo ThinkPad',patrimonio:'NB-002',dataCompra:'2022-06-10',dataGarantia:'2024-06-10',status:'Fora da garantia - aguardando compra',prioridade:'Média',valor:3000,obs:''},
    {id:'nb-003',colaborador:'Pedro Costa',email:'pedro@empresa.com',depto:'Financeiro',local:'Belo Horizonte/MG',modelo:'HP Pavilion',patrimonio:'NB-003',dataCompra:'2024-03-20',dataGarantia:'2026-03-20',status:'Compra aprovada',prioridade:'Alta',valor:2800,obs:'Em processo'},
    {id:'nb-004',colaborador:'Ana Ferreira',email:'ana@empresa.com',depto:'Marketing',local:'Brasília/DF',modelo:'Asus VivoBook',patrimonio:'NB-004',dataCompra:'2023-08-12',dataGarantia:'2025-08-12',status:'Novo notebook enviado',prioridade:'Média',valor:2200,obs:''},
    {id:'nb-005',colaborador:'Carlos Oliveira',email:'carlos@empresa.com',depto:'TI',local:'Remoto - Recife/PE',modelo:'MacBook Air M2',patrimonio:'NB-005',dataCompra:'2023-11-05',dataGarantia:'2025-11-05',status:'Troca concluída',prioridade:'Alta',valor:7500,obs:'Entrega confirmada'},
    {id:'nb-006',colaborador:'Julia Mendes',email:'julia@empresa.com',depto:'Vendas',local:'Salvador/BA',modelo:'Dell Vostro 15',patrimonio:'NB-006',dataCompra:'2024-01-10',dataGarantia:'2026-01-10',status:'Em garantia',prioridade:'Baixa',valor:2400,obs:''}
  ];
}
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); render(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

function isOutOfWarranty(item){
  if(!item.dataGarantia) return null;
  return new Date(item.dataGarantia+'T12:00:00') < new Date() ? 'Sim' : 'Não';
}
function daysOverdue(item){
  if(!item.dataGarantia) return null;
  const diff = Math.floor((new Date() - new Date(item.dataGarantia+'T12:00:00')) / 86400000);
  return diff;
}
function statusTone(s){
  if(s==='Troca concluída') return 'green';
  if(s==='Novo notebook enviado' || s==='Compra aprovada') return 'blue';
  if(s==='Fora da garantia - aguardando compra') return 'red';
  return 'grey';
}

function renderKpis(){
  const total = items.length;
  const fora = items.filter(i=>isOutOfWarranty(i)==='Sim').length;
  const aguardando = items.filter(i=>i.status==='Fora da garantia - aguardando compra').length;
  const emTroca = items.filter(i=>i.status==='Compra aprovada'||i.status==='Novo notebook enviado').length;
  const concluidas = items.filter(i=>i.status==='Troca concluída').length;
  const valorTotal = items.reduce((sum,i)=>sum+(Number(i.valor)||0),0);
  $('#kpis').innerHTML = `
    <div class="kpi"><small>Total cadastrado</small><div class="val">${total}</div></div>
    <div class="kpi warn"><small>Fora da garantia</small><div class="val">${fora}</div></div>
    <div class="kpi"><small>Aguardando compra</small><div class="val">${aguardando}</div></div>
    <div class="kpi"><small>Em processo de troca</small><div class="val">${emTroca}</div></div>
    <div class="kpi ok"><small>Trocas concluídas</small><div class="val">${concluidas}</div></div>
    <div class="kpi money"><small>Investimento estimado</small><div class="val mono">${brl(valorTotal)}</div></div>
  `;
}

function populateFilters(){
  const statusSel = $('#filterStatus');
  const current = statusSel.value;
  statusSel.innerHTML = '<option value="">Todos os status</option>' + statuses.map(s=>`<option ${current===s?'selected':''}>${s}</option>`).join('');
}

function renderTable(){
  const q = $('#search').value.trim().toLowerCase();
  const fStatus = $('#filterStatus').value;
  const fPrio = $('#filterPrio').value;
  const fWarranty = $('#filterWarranty').value;

  let filtered = items.filter(i=>{
    const matchesQ = !q || [i.colaborador,i.patrimonio,i.modelo].some(v=>String(v||'').toLowerCase().includes(q));
    const matchesStatus = !fStatus || i.status===fStatus;
    const matchesPrio = !fPrio || i.prioridade===fPrio;
    const matchesWarranty = !fWarranty || isOutOfWarranty(i)===fWarranty;
    return matchesQ && matchesStatus && matchesPrio && matchesWarranty;
  });

  filtered.sort((a,b)=>{
    const da = daysOverdue(a) ?? -99999, db = daysOverdue(b) ?? -99999;
    return db - da;
  });

  $('#resultCount').textContent = filtered.length ? `${filtered.length} notebook${filtered.length===1?'':'s'}` : '';

  $('#tableBody').innerHTML = filtered.length ? filtered.map(i=>{
    const out = isOutOfWarranty(i);
    const overdue = daysOverdue(i);
    const warrantyBadge = out===null ? `<span class="badge grey">—</span>`
      : out==='Sim' ? `<span class="badge red">Fora · ${overdue}d</span>`
      : `<span class="badge green">Em garantia</span>`;
    return `<tr data-id="${i.id}">
      <td>${esc(i.colaborador)}</td>
      <td>${esc(i.depto)||'—'}</td>
      <td>${esc(i.local)||'—'}</td>
      <td>${esc(i.modelo)||'—'}</td>
      <td class="mono">${esc(i.patrimonio)||'—'}</td>
      <td>${dateBR(i.dataGarantia)}</td>
      <td>${warrantyBadge}</td>
      <td><span class="badge ${statusTone(i.status)}">${esc(i.status||'—')}</span></td>
      <td><span class="prio-dot prio-${esc(i.prioridade)}"></span>${esc(i.prioridade)||'—'}</td>
      <td class="mono">${i.valor ? brl(i.valor) : '—'}</td>
      <td><div class="row-actions">
        <button class="ghost edit-btn">Editar</button>
        <button class="danger del-btn">Excluir</button>
      </div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="11"><div class="empty">Nenhum notebook cadastrado ainda.<br><button class="primary" id="emptyAdd">＋ Cadastrar o primeiro</button></div></td></tr>`;
}

function render(){ renderKpis(); populateFilters(); renderTable(); }

function openForm(item){
  const f = $('#notebookForm');
  f.reset();
  $('#id').value = item?.id || '';
  $('#formTitle').textContent = item ? 'Editar notebook' : 'Novo notebook';
  if(item){
    for(const k of ['colaborador','email','depto','local','modelo','patrimonio','dataCompra','dataGarantia','status','prioridade','valor','obs']){
      const el = $('#'+k);
      if(el) el.value = item[k] ?? '';
    }
  } else {
    $('#status').value = 'Em garantia';
    $('#prioridade').value = 'Média';
  }
  $('#formDialog').showModal();
}

$('#addBtn').addEventListener('click', ()=>openForm());
document.addEventListener('click', e=>{
  if(e.target.id==='emptyAdd') openForm();
  if(e.target.matches('[data-close]')) e.target.closest('dialog').close();
  const row = e.target.closest('tr[data-id]');
  if(row && e.target.classList.contains('edit-btn')){
    openForm(items.find(i=>i.id===row.dataset.id));
  }
  if(row && e.target.classList.contains('del-btn')){
    const item = items.find(i=>i.id===row.dataset.id);
    if(confirm(`Excluir o registro de "${item.colaborador}"? Esta ação não pode ser desfeita.`)){
      items = items.filter(i=>i.id!==item.id);
      save();
      toast('Registro excluído.');
    }
  }
});

$('#notebookForm').addEventListener('submit', e=>{
  e.preventDefault();
  const id = $('#id').value || (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now());
  const data = { id };
  for(const k of ['colaborador','email','depto','local','modelo','patrimonio','dataCompra','dataGarantia','status','prioridade','obs']){
    data[k] = $('#'+k).value.trim();
  }
  data.valor = $('#valor').value ? Number($('#valor').value) : 0;
  if(!data.colaborador){ toast('Informe o nome do colaborador.'); return; }
  const existingIndex = items.findIndex(i=>i.id===id);
  if(existingIndex>=0) items[existingIndex] = data; else items.unshift(data);
  save();
  $('#formDialog').close();
  toast(existingIndex>=0 ? 'Registro atualizado.' : 'Notebook cadastrado.');
});

['search','filterStatus','filterPrio','filterWarranty'].forEach(id=>{
  $('#'+id).addEventListener('input', renderTable);
  $('#'+id).addEventListener('change', renderTable);
});

$('#exportJson').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));
  a.download = 'notebooks-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup exportado!');
});

$('#importJson').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw Error();
      if(!confirm(`Importar ${data.length} registros? Isto substituirá os dados atuais.`)) return;
      items = data;
      save();
      toast('Backup restaurado!');
    } catch { alert('Arquivo inválido.'); }
  };
  r.readAsText(file);
});

$('#exportCsv').addEventListener('click', ()=>{
  const headers = ['Colaborador','E-mail','Departamento','Local','Modelo','Patrimônio','Data Compra','Fim Garantia','Fora da Garantia','Status','Prioridade','Valor Estimado','Observações'];
  const rows = items.map(i => [
    i.colaborador, i.email, i.depto, i.local, i.modelo, i.patrimonio,
    i.dataCompra, i.dataGarantia, isOutOfWarranty(i) || '', i.status, i.prioridade, i.valor, i.obs
  ]);
  const csv = [headers, ...rows].map(row => row.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'notebooks-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV exportado!');
});

// Funções para Excel
function downloadTemplate(){
  const headers = ['Colaborador*','E-mail (UPN)','Departamento','Local','Modelo do notebook','Patrimônio / Serial','Data de compra (AAAA-MM-DD)','Fim da garantia (AAAA-MM-DD)','Status','Prioridade','Valor estimado (R$)','Observações'];
  const sampleData = [
    ['João Silva','joao.silva@empresa.com','TI','Recife/PE','Dell Inspiron 15','NB-001','2023-01-15','2025-01-15','Em garantia','Alta','2500','Processa bem'],
    ['Maria Santos','maria@empresa.com','RH','São Paulo/SP','Lenovo ThinkPad','NB-002','2022-06-10','2024-06-10','Fora da garantia - aguardando compra','Média','3000',''],
  ];
  
  const workbook = XLSX.utils.book_new();
  const worksheet = XLSX.utils.aoa_to_sheet([headers, ...sampleData]);
  
  // Estilos e larguras
  worksheet['!cols'] = [
    {wch:20},{wch:22},{wch:15},{wch:18},{wch:18},
    {wch:18},{wch:20},{wch:20},{wch:28},{wch:12},{wch:15},{wch:30}
  ];
  
  // Formatação do cabeçalho
  for(let i=0;i<headers.length;i++){
    const cellRef = XLSX.utils.encode_col(i)+'1';
    if(!worksheet[cellRef]) worksheet[cellRef]={};
    worksheet[cellRef].s={fill:{fgColor:{rgb:'FFF0A6'}},font:{bold:true}};
  }
  
  XLSX.utils.book_append_sheet(workbook, worksheet, 'Notebooks');
  XLSX.writeFile(workbook, 'template-notebooks-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Template baixado!');
}

$('#downloadTemplate').addEventListener('click', downloadTemplate);

$('#importExcel').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = evt => {
    try{
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data,{type:'array'});
      const worksheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(worksheet,{header:1});
      
      if(rows.length<2) throw new Error('Planilha vazia');
      
      const headers = rows[0].map(h=>String(h||'').toLowerCase().trim());
      const colMap = {
        'colaborador':0,'e-mail (upn)':1,'departamento':2,'local':3,'modelo do notebook':4,
        'patrimônio / serial':5,'data de compra (aaaa-mm-dd)':6,'fim da garantia (aaaa-mm-dd)':7,
        'status':8,'prioridade':9,'valor estimado (r$)':10,'observações':11
      };
      
      const imported = [];
      for(let i=1;i<rows.length;i++){
        const row = rows[i];
        if(!row[0]) continue; // Pula linhas vazias
        
        const item = {
          id: crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+i,
          colaborador: String(row[0]||'').trim(),
          email: String(row[1]||'').trim(),
          depto: String(row[2]||'').trim(),
          local: String(row[3]||'').trim(),
          modelo: String(row[4]||'').trim(),
          patrimonio: String(row[5]||'').trim(),
          dataCompra: String(row[6]||'').trim(),
          dataGarantia: String(row[7]||'').trim(),
          status: String(row[8]||'Em garantia').trim(),
          prioridade: String(row[9]||'Média').trim(),
          valor: row[10] ? Number(row[10]) : 0,
          obs: String(row[11]||'').trim()
        };
        
        if(item.colaborador) imported.push(item);
      }
      
      if(!imported.length) throw new Error('Nenhum registro válido encontrado');
      
      if(!confirm(`Importar ${imported.length} notebook(s)? Isto substituirá os dados atuais.`)) return;
      
      items = imported;
      save();
      toast(`${imported.length} notebook(s) importado(s) com sucesso!`);
    } catch(err){
      alert('Erro ao importar planilha: '+err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

// Renderizar dados iniciais
setTimeout(() => {
  render();
}, 100);
</script>
