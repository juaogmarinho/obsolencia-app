<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Controle de Notebooks — Hostname · Empresa/Vínculo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1020;
    --bg-2:#101827;
    --panel:#121d2e;
    --panel-2:#172437;
    --panel-3:#1d2a3d;
    --line:#2b3a52;
    --text:#ecf3ff;
    --muted:#9aa9bd;
    --muted-2:#7181a1;
    --amber:#f6b56b;
    --amber-soft:#3a2c17;
    --red:#ff6b6b;
    --red-soft:#3e2021;
    --green:#53d6a1;
    --green-soft:#12342c;
    --blue:#68a9ff;
    --blue-soft:#132642;
    --shadow:0 18px 40px rgba(8, 12, 24, 0.46);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(circle at top left, rgba(104,169,255,0.14), transparent 30%),
      radial-gradient(circle at bottom right, rgba(246,181,107,0.12), transparent 28%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;letter-spacing:.01em;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}
  .mono{font-family:'IBM Plex Mono',monospace}
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;padding:30px 36px 20px;border-bottom:1px solid rgba(255,255,255,.06);flex-wrap:wrap;gap:14px;
    background:rgba(11,16,32,.65);backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;
    box-shadow:0 12px 30px rgba(6,10,18,.18);
  }
  header.top .eyebrow{color:var(--muted-2);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace}
  header.top h1{font-size:30px;margin-top:6px;letter-spacing:-.04em}
  header.top .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
  header.top .actions-primary{display:flex;gap:6px}
  header.top .actions-secondary{display:flex;gap:8px;border-left:1px solid rgba(255,255,255,.06);padding-left:12px;margin-left:2px;flex-wrap:wrap}
  button{
    font-family:'Inter',sans-serif;cursor:pointer;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
    color:var(--text);padding:10px 14px;font-size:13px;font-weight:600;transition:.18s ease;white-space:nowrap;box-shadow:0 10px 20px rgba(0,0,0,.12)
  }
  button:hover{border-color:rgba(255,255,255,.18);background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));transform:translateY(-1px)}
  button.primary{background:linear-gradient(135deg,#f8c777,#ef9b3d);border:none;color:#231501;font-weight:800;box-shadow:0 12px 24px rgba(239,155,61,.35)}
  button.primary:hover{filter:brightness(1.08)}
  button.danger{color:var(--red);background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.18)}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:12px;padding:8px 12px}
  button.ghost:hover{color:var(--text);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.16)}
  label.file-input{cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:12px;padding:8px 12px;border-radius:10px;transition:.18s ease;margin:0;box-shadow:0 10px 20px rgba(0,0,0,.08)}
  label.file-input:hover{color:var(--text);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.16)}
  label.file-input input{display:none}
  @media (max-width:1200px){header.top .actions-secondary{border-left:none;padding-left:0;margin-left:0}}
  main{padding:28px 36px 60px;max-width:1400px;margin:0 auto}

  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:26px}
  .kpi{background:linear-gradient(180deg, rgba(18,29,46,.94), rgba(16,24,39,.96));border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;transition:.2s ease;box-shadow:var(--shadow)}
  .kpi:hover{border-color:rgba(104,169,255,.28);transform:translateY(-2px)}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg, rgba(154,169,189,.6), rgba(154,169,189,.3))}
  .kpi.warn::before{background:linear-gradient(90deg, var(--red), rgba(255,107,107,.45))}
  .kpi.ok::before{background:linear-gradient(90deg, var(--green), rgba(83,214,161,.45))}
  .kpi.money::before{background:linear-gradient(90deg, var(--amber), rgba(246,181,107,.5))}
  .kpi small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
  .kpi .val{font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;margin-top:10px;letter-spacing:-.05em}
  .kpi.warn .val{color:var(--red)}
  .kpi.ok .val{color:var(--green)}
  .kpi.money .val{font-size:24px;color:var(--amber)}

  .toolbar{display:grid;grid-template-columns:minmax(240px,3fr) minmax(170px,1.2fr) minmax(170px,1.2fr) minmax(140px,0.8fr);gap:12px;align-items:center;margin-bottom:14px;padding:12px;border:1px solid rgba(255,255,255,.05);background:rgba(18,29,46,.7);border-radius:12px;box-shadow:0 10px 20px rgba(9,14,22,.15)}
  .toolbar input[type=text]{width:100%}
  .toolbar input,.toolbar select{background:linear-gradient(180deg, rgba(23,36,55,.9), rgba(17,25,39,.8));border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px;font-family:'Inter',sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);width:100%;outline:none}
  .toolbar select{
    cursor:pointer;
    appearance:none;
    -webkit-appearance:none;
    -moz-appearance:none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%),
      linear-gradient(180deg, rgba(23,36,55,.9), rgba(17,25,39,.8));
    background-position:
      calc(100% - 18px) calc(50% - 3px),
      calc(100% - 13px) calc(50% - 3px),
      0 0;
    background-size:5px 5px, 5px 5px, 100% 100%;
    background-repeat:no-repeat;
    padding-right:34px;
  }
  .toolbar select option{background:var(--panel-2);color:var(--text)}
  .result-count{color:var(--muted);font-size:12px;margin:0 0 12px;padding-left:4px}

  .table-wrap{
    overflow-x:auto;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    background:linear-gradient(180deg, rgba(18,29,46,.95), rgba(16,24,39,.9));
    border:1px solid rgba(255,255,255,.06);
    scrollbar-width:thin;
    scrollbar-color:rgba(154,169,189,.45) transparent;
  }
  .table-wrap::-webkit-scrollbar{height:8px}
  .table-wrap::-webkit-scrollbar-thumb{background:rgba(154,169,189,.45);border-radius:999px}
  table{width:100%;min-width:1100px;border-collapse:collapse;border-spacing:0;background:transparent;border-radius:var(--radius);overflow:hidden;font-size:13px;table-layout:auto}
  thead th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:linear-gradient(180deg, rgba(23,36,55,.96), rgba(16,24,39,.96));padding:12px 12px;border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap}
  tbody td{padding:12px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;white-space:nowrap;overflow-wrap:normal}
  thead th[data-key]{cursor:pointer}
  thead th[data-key]:hover{color:var(--text)}
  tbody td{padding:12px 12px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:.15s ease}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;letter-spacing:.02em}
  .badge.red{background:rgba(255,107,107,.12);color:var(--red)}
  .badge.green{background:rgba(83,214,161,.12);color:var(--green)}
  .badge.amber{background:rgba(246,181,107,.12);color:var(--amber)}
  .badge.blue{background:rgba(104,169,255,.12);color:var(--blue)}
  .badge.grey{background:rgba(154,169,189,.12);color:var(--muted)}
  .prio-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;box-shadow:0 0 0 4px rgba(255,255,255,.02)}
  .prio-Alta{background:var(--red)}
  .prio-Média{background:var(--amber)}
  .prio-Baixa{background:var(--muted-2)}
  .row-actions{display:flex;gap:6px}
  .row-actions button{padding:6px 10px;font-size:12px}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .empty button{margin-top:10px}

  dialog{border:1px solid rgba(255,255,255,.08);border-radius:18px;background:linear-gradient(180deg, rgba(18,29,46,.98), rgba(11,17,27,.98));color:var(--text);padding:0;width:min(640px,92vw);box-shadow:0 34px 80px rgba(5,9,16,.7)}
  dialog::backdrop{background:rgba(5,8,13,.72);backdrop-filter:blur(4px)}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.06)}
  .modal-head h2{font-size:20px;letter-spacing:-.03em}
  .modal-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;max-height:65vh;overflow:auto}
  .modal-body label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
  .modal-body label.full{grid-column:1/-1}
  .modal-body input,.modal-body select,.modal-body textarea{background:rgba(23,36,55,.92);border:1px solid rgba(255,255,255,.08);color:var(--text);border-radius:10px;padding:9px 11px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:.15s ease}
  .modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus{border-color:rgba(104,169,255,.7);box-shadow:0 0 0 3px rgba(104,169,255,.15)}
  .modal-body textarea{resize:vertical;min-height:60px}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid rgba(255,255,255,.06)}
  .close-x{background:none;border:none;color:var(--muted);font-size:22px;padding:2px 8px;box-shadow:none}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(19,27,38,.95);border:1px solid rgba(255,255,255,.08);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s ease;box-shadow:var(--shadow)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  #dashboard > div{background:linear-gradient(180deg, rgba(18,29,46,.95), rgba(13,18,28,.96));border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
  #dashboard h2{margin:0 0 12px;font-size:24px;letter-spacing:-.03em}
  #dashboardContent{padding-top:8px}
  #dashboardContent > div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  #dashboardContent > div > div{background:linear-gradient(180deg, rgba(23,36,55,.96), rgba(17,25,39,.96));border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:14px;min-height:220px;box-shadow:0 10px 20px rgba(7,11,18,.18)}
  #dashboardContent h3{margin:0 0 10px;font-size:16px;color:var(--text)}
  canvas{display:block;max-width:100%;border-radius:10px}

  @media (max-width:1100px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    #dashboardContent > div{grid-template-columns:1fr}
    main{padding:22px 22px 56px}
  }
  @media (max-width:820px){
    .toolbar{grid-template-columns:1fr; padding:10px}
    header.top .actions{width:100%}
    header.top .actions-secondary{width:100%}
    header.top .actions button,header.top .actions label.file-input{flex:1 1 calc(50% - 8px);justify-content:center}
  }
  @media (max-width:700px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    main{padding:18px}
    .modal-body{grid-template-columns:1fr}
    header.top{flex-direction:column;align-items:stretch;gap:12px;padding:22px 18px 18px}
    header.top .actions{flex-direction:column}
    header.top .actions-secondary{flex-wrap:wrap;border-left:none;padding-left:0;margin-left:0}
    header.top .actions button,header.top .actions label.file-input{width:100%;justify-content:center;font-size:11px;flex-basis:100%}
  }
  @media (max-width:480px){
    .kpis{grid-template-columns:1fr}
    header.top h1{font-size:24px}
    .kpi .val{font-size:28px}
    .row-actions{flex-direction:column;align-items:stretch}
    .row-actions button{width:100%}
    .modal-head, .modal-actions{padding-left:16px;padding-right:16px}
    .modal-body{padding-left:16px;padding-right:16px}
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <p class="eyebrow">TI · GESTÃO DE ATIVOS</p>
    <h1>Controle de Notebooks</h1>
  </div>
  <div class="actions">
    <div class="actions-secondary">
      <button class="ghost" id="downloadTemplate" title="Baixar template Excel">📥 Template</button>
      <button class="ghost" id="exportCsv" title="Exportar dados em CSV">📊 CSV</button>
      <button class="ghost" id="exportJson" title="Fazer backup em JSON">💾 Backup</button>
      <label class="file-input" title="Importar dados do Excel">
        📤 Importar Excel
        <input type="file" id="importExcel" accept=".xlsx,.xls">
      </label>
      <label class="file-input" title="Restaurar backup JSON">
        📥 Importar JSON
        <input type="file" id="importJson" accept="application/json">
      </label>
      <button class="ghost" id="openDashboard" title="Ir para Dashboard">📈 Dashboard</button>
    </div>
    <button class="primary" id="addBtn">＋ Novo notebook</button>
  </div>
</header>

<main>
  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Buscar por colaborador, patrimônio ou modelo...">
    <select id="filterStatus"><option value="">Todos os status</option></select>
    <select id="filterPrio"><option value="">Todas as prioridades</option></select>
    <select id="pageSize" aria-label="Itens por página">
      <option value="5">5 por página</option>
      <option value="10" selected>10 por página</option>
      <option value="15">15 por página</option>
      <option value="20">20 por página</option>
      <option value="30">30 por página</option>
    </select>
  </div>
  <p class="result-count" id="resultCount"></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="colaborador">Colaborador</th><th data-key="depto">Departamento</th><th data-key="local">Local</th><th data-key="modelo">Modelo</th>
          <th data-key="patrimonio">Patrimônio/Serial</th><th data-key="hostname">Hostname</th><th data-key="empresa">Empresa/Vínculo</th>
          <th data-key="status">Status</th><th data-key="prioridade">Prioridade</th><th data-key="obs">Observações</th><th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div id="pager" style="margin-top:12px;display:flex;justify-content:center;gap:8px;align-items:center;color:var(--muted)"></div>
</main>

<section id="dashboard" style="max-width:1400px;margin:20px auto 60px;display:none;height:420px;overflow:hidden;">
  <div style="background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;">
    <h2 style="margin:0 0 12px">Dashboard detalhado</h2>
    <div id="dashboardContent">
      <!-- Conteúdo será preenchido por renderDashboard() -->
    </div>
  </div>
</section>

<dialog id="formDialog">
  <form id="notebookForm">
    <div class="modal-head">
      <h2 id="formTitle">Novo notebook</h2>
      <button type="button" class="close-x" data-close>×</button>
    </div>
    <input type="hidden" id="id">
    <div class="modal-body">
      <label>Colaborador*<input id="colaborador" required></label>
      <label>E-mail (UPN)<input id="email" type="email"></label>
      <label>Departamento<input id="depto"></label>
      <label>Localização<input id="local" placeholder="Ex.: Remoto - Recife/PE"></label>
      <label>Modelo do notebook<input id="modelo"></label>
      <label>Patrimônio / Serial<input id="patrimonio"></label>
      <label>Data de compra<input id="dataCompra" type="date"></label>
      <label>Hostname<input id="hostname" placeholder="ex: host123.imagem"></label>
      <label>Empresa/Vínculo<input id="empresa" placeholder="ex: Empresa S/A"></label>
      <label>Status
        <select id="status">
          <option>Ativo</option>
          <option>Aguardando substituição</option>
          <option>Compra aprovada</option>
          <option>Novo notebook enviado</option>
          <option>Troca concluída</option>
        </select>
      </label>
      <label>Prioridade
        <select id="prioridade"><option>Alta</option><option>Média</option><option>Baixa</option></select>
      </label>
      <label class="full">Observações<textarea id="obs"></textarea></label>
    </div>
    <div class="modal-actions">
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button class="primary" type="submit">Salvar</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="xlsx.full.min.js"></script>
<script>
const KEY = 'notebooks-v1';
const statuses = ['Ativo','Aguardando substituição','Compra aprovada','Novo notebook enviado','Troca concluída'];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dateBR = v => v ? new Intl.DateTimeFormat('pt-BR').format(new Date(v+'T12:00:00')) : '—';

let items = load();

function load(){ 
  try{ 
    const d = JSON.parse(localStorage.getItem(KEY)); 
    if(Array.isArray(d) && d.length > 0) return d;
  } catch { }
  
  // Dados de exemplo iniciais
  return [
    {id:'nb-001',colaborador:'João Silva',email:'joao.silva@empresa.com',depto:'TI',local:'Recife/PE',modelo:'Dell Inspiron 15',patrimonio:'NB-001',dataCompra:'2023-01-15',hostname:'nb-001-host',empresa:'Empresa A',status:'Aguardando substituição',prioridade:'Alta',obs:'Processa bem, requer manutenção'},
    {id:'nb-002',colaborador:'Maria Santos',email:'maria@empresa.com',depto:'RH',local:'São Paulo/SP',modelo:'Lenovo ThinkPad',patrimonio:'NB-002',dataCompra:'2022-06-10',hostname:'nb-002-host',empresa:'Empresa B',status:'Aguardando substituição',prioridade:'Média',obs:''},
    {id:'nb-003',colaborador:'Pedro Costa',email:'pedro@empresa.com',depto:'Financeiro',local:'Belo Horizonte/MG',modelo:'HP Pavilion',patrimonio:'NB-003',dataCompra:'2024-03-20',hostname:'nb-003-host',empresa:'Empresa A',status:'Compra aprovada',prioridade:'Alta',obs:'Em processo'},
    {id:'nb-004',colaborador:'Ana Ferreira',email:'ana@empresa.com',depto:'Marketing',local:'Brasília/DF',modelo:'Asus VivoBook',patrimonio:'NB-004',dataCompra:'2023-08-12',hostname:'nb-004-host',empresa:'Empresa C',status:'Novo notebook enviado',prioridade:'Média',obs:''},
    {id:'nb-005',colaborador:'Carlos Oliveira',email:'carlos@empresa.com',depto:'TI',local:'Remoto - Recife/PE',modelo:'MacBook Air M2',patrimonio:'NB-005',dataCompra:'2023-11-05',hostname:'nb-005-host',empresa:'Empresa A',status:'Troca concluída',prioridade:'Alta',obs:'Entrega confirmada'},
    {id:'nb-006',colaborador:'Julia Mendes',email:'julia@empresa.com',depto:'Vendas',local:'Salvador/BA',modelo:'Dell Vostro 15',patrimonio:'NB-006',dataCompra:'2024-01-10',hostname:'nb-006-host',empresa:'Empresa B',status:'Ativo',prioridade:'Baixa',obs:''}
  ];
}
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); render(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }

function statusTone(s){
  if(s==='Troca concluída') return 'green';
  if(s==='Novo notebook enviado' || s==='Compra aprovada') return 'blue';
  if(s==='Aguardando substituição') return 'red';
  return 'grey';
}

function renderKpis(){
  const total = items.length;
  const hosts = items.filter(i=>i.hostname).length;
  const companies = new Set(items.map(i=>i.empresa).filter(Boolean)).size;
  const aguardando = items.filter(i=>i.status==='Aguardando substituição').length;
  const emTroca = items.filter(i=>i.status==='Compra aprovada'||i.status==='Novo notebook enviado').length;
  const concluidas = items.filter(i=>i.status==='Troca concluída').length;
  $('#kpis').innerHTML = `
    <div class="kpi"><small>Total cadastrado</small><div class="val">${total}</div></div>
    <div class="kpi"><small>Hosts cadastrados</small><div class="val mono">${hosts}</div></div>
    <div class="kpi"><small>Empresas/Vínculos</small><div class="val">${companies}</div></div>
    <div class="kpi"><small>Aguardando compra</small><div class="val">${aguardando}</div></div>
    <div class="kpi ok"><small>Trocas concluídas</small><div class="val">${concluidas}</div></div>
    <div class="kpi"><small>Em processo de troca</small><div class="val">${emTroca}</div></div>
  `;
}

function populateFilters(){
  const statusSel = $('#filterStatus');
  const current = statusSel.value;
  statusSel.innerHTML = '<option value="">Todos os status</option>' + statuses.map(s=>`<option ${current===s?'selected':''}>${s}</option>`).join('');
}

let SORT_BY = null; let SORT_DIR = 1; let PAGE = 1; let PAGE_SIZE = 10;
const PAGE_OPTIONS = [5,10,15,20,30];

function populatePageSize(){
  const el = $('#pageSize');
  if(!el) return;
  el.innerHTML = PAGE_OPTIONS.map(v => `<option value="${v}" ${v===PAGE_SIZE ? 'selected':''}>${v} por página</option>`).join('');
}

function renderTable(){
  const q = $('#search').value.trim().toLowerCase();
  const fStatus = $('#filterStatus').value;
  const fPrio = $('#filterPrio').value;

  let filtered = items.filter(i=>{
    const matchesQ = !q || [i.colaborador,i.patrimonio,i.modelo,i.hostname,i.empresa].some(v=>String(v||'').toLowerCase().includes(q));
    const matchesStatus = !fStatus || i.status===fStatus;
    const matchesPrio = !fPrio || i.prioridade===fPrio;
    return matchesQ && matchesStatus && matchesPrio;
  });

  // Ordenação
  if(SORT_BY){
    filtered.sort((a,b)=>{
      const va = a[SORT_BY] ?? '';
      const vb = b[SORT_BY] ?? '';
      const na = Number(va); const nb = Number(vb);
      if(!Number.isNaN(na) && !Number.isNaN(nb)) return (na - nb) * SORT_DIR;
      return String(va).localeCompare(String(vb), 'pt-BR', {numeric:true}) * SORT_DIR;
    });
  }

  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if(PAGE > totalPages) PAGE = totalPages;
  const start = (PAGE - 1) * PAGE_SIZE;
  const end = start + PAGE_SIZE;
  const pageItems = filtered.slice(start, end);

  $('#resultCount').textContent = total ? `${total} notebook${total===1?'':'s'} — página ${PAGE}/${totalPages}` : '';

  $('#tableBody').innerHTML = pageItems.length ? pageItems.map(i=>{
    return `<tr data-id="${i.id}">
      <td data-key="colaborador">${esc(i.colaborador)}</td>
      <td data-key="depto">${esc(i.depto)||'—'}</td>
      <td data-key="local">${esc(i.local)||'—'}</td>
      <td data-key="modelo">${esc(i.modelo)||'—'}</td>
      <td class="mono" data-key="patrimonio">${esc(i.patrimonio)||'—'}</td>
      <td class="mono" data-key="hostname">${esc(i.hostname)||'—'}</td>
      <td data-key="empresa">${esc(i.empresa)||'—'}</td>
      <td data-key="status"><span class="badge ${statusTone(i.status)}">${esc(i.status||'—')}</span></td>
      <td data-key="prioridade"><span class="prio-dot prio-${esc(i.prioridade)}"></span>${esc(i.prioridade)||'—'}</td>
      <td data-key="obs">${esc(i.obs)||'—'}</td>
      <td><div class="row-actions">
        <button class="ghost edit-btn">Editar</button>
        <button class="danger del-btn">Excluir</button>
      </div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="11"><div class="empty">Nenhum notebook cadastrado ainda.<br><button class="primary" id="emptyAdd">＋ Cadastrar o primeiro</button></div></td></tr>`;

  renderPager(total, totalPages);
}

function renderPager(total, totalPages){
  const p = $('#pager');
  if(!p) return;
  if(total<=PAGE_SIZE){ p.innerHTML = ''; return; }
  p.innerHTML = `
    <button class="ghost" id="prevPage" ${PAGE<=1? 'disabled':''}>&larr; Anterior</button>
    <div style="padding:4px 8px;border-radius:8px;background:var(--panel-2)">Página ${PAGE} de ${totalPages}</div>
    <button class="ghost" id="nextPage" ${PAGE>=totalPages? 'disabled':''}>Próxima &rarr;</button>
  `;
}

// Header sorting and pager controls
document.addEventListener('click', e=>{
  const th = e.target.closest('th[data-key]');
  if(th){
    const key = th.getAttribute('data-key');
    if(SORT_BY===key) SORT_DIR = -SORT_DIR; else { SORT_BY = key; SORT_DIR = 1; }
    PAGE = 1; renderTable();
    return;
  }
  if(e.target.id === 'prevPage'){
    if(PAGE>1) PAGE--; renderTable(); return;
  }
  if(e.target.id === 'nextPage'){
    PAGE++; renderTable(); return;
  }
});

document.addEventListener('change', e=>{
  if(e.target.id === 'pageSize'){
    PAGE_SIZE = Number(e.target.value) || 10;
    PAGE = 1;
    populatePageSize();
    renderTable();
  }
});

const _charts = {};
let DASHBOARD_RENDERING = false;

function render(){ renderKpis(); populateFilters(); populatePageSize(); renderTable();
  // Only render dashboard when it is visible to avoid repeated re-renders
  const sec = $('#dashboard');
  if(sec && sec.style.display && sec.style.display !== 'none') renderDashboard();
}

function renderDashboard(){
  const byDept = {};
  const byStatus = {};
  const byCompany = {};
  for(const it of items){
    const dept = it.depto || 'Sem departamento';
    const st = it.status || '—';
    const comp = it.empresa || 'Sem empresa';
    byDept[dept] = (byDept[dept]||0) + 1;
    byStatus[st] = (byStatus[st]||0) + 1;
    byCompany[comp] = (byCompany[comp]||0) + 1;
  }

  const deptLabels = Object.keys(byDept).sort((a,b)=>byDept[b]-byDept[a]);
  const deptData = deptLabels.map(l=>byDept[l]);
  const statusLabels = Object.keys(byStatus).sort((a,b)=>byStatus[b]-byStatus[a]);
  const statusData = statusLabels.map(l=>byStatus[l]);
  const compLabels = Object.keys(byCompany).sort((a,b)=>byCompany[b]-byCompany[a]);
  const compData = compLabels.map(l=>byCompany[l]);

  const html = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      <div style="background:var(--panel);border-radius:8px;padding:12px;min-height:200px">
        <h3 style="margin:0 0 8px">Por Departamento</h3>
        <canvas id="chartDept" width="600" height="160" style="display:block;max-width:100%"></canvas>
      </div>
      <div style="background:var(--panel);border-radius:8px;padding:12px;min-height:200px">
        <h3 style="margin:0 0 8px">Por Status</h3>
        <canvas id="chartStatus" width="300" height="160" style="display:block;max-width:100%"></canvas>
      </div>
      <div style="background:var(--panel);border-radius:8px;padding:12px;min-height:200px">
        <h3 style="margin:0 0 8px">Por Empresa/Vínculo</h3>
        <canvas id="chartCompany" width="600" height="160" style="display:block;max-width:100%"></canvas>
      </div>
    </div>
  `;

  const c = $('#dashboardContent');
  if(!c) return;

  // Prevent concurrent renders
  if(DASHBOARD_RENDERING) return;
  DASHBOARD_RENDERING = true;
  const openBtn = $('#openDashboard');
  if(openBtn) openBtn.disabled = true;

  c.innerHTML = html;

  // destruir charts anteriores
  try{ if(_charts.dept) _charts.dept.destroy(); }catch(e){}
  try{ if(_charts.status) _charts.status.destroy(); }catch(e){}
  try{ if(_charts.company) _charts.company.destroy(); }catch(e){}

  try {
    // criar novos gráficos usando Chart.js
    const ctxDept = document.getElementById('chartDept').getContext('2d');
    _charts.dept = new Chart(ctxDept, {
      type: 'bar',
      data: { labels: deptLabels, datasets: [{ label: 'Quantidade', data: deptData, backgroundColor: 'rgba(91,157,238,0.85)' }] },
      options: { plugins:{legend:{display:false}}, responsive:false, scales:{y:{beginAtZero:true}} }
    });

    const ctxStatus = document.getElementById('chartStatus').getContext('2d');
    const palette = ['#4fd39a','#f0a63c','#ef5b5b','#5b9dee','#8b96a8'];
    _charts.status = new Chart(ctxStatus, {
      type: 'doughnut',
      data: { labels: statusLabels, datasets: [{ data: statusData, backgroundColor: statusLabels.map((_,i)=>palette[i%palette.length]) }] },
      options: { responsive:false }
    });

    const ctxComp = document.getElementById('chartCompany').getContext('2d');
    _charts.company = new Chart(ctxComp, {
      type: 'bar',
      data: { labels: compLabels, datasets: [{ label: 'Quantidade', data: compData, backgroundColor: 'rgba(79,211,154,0.85)' }] },
      options: { indexAxis: 'y', responsive:false, scales:{x:{beginAtZero:true}} }
    });
  } finally {
    DASHBOARD_RENDERING = false;
    if(openBtn) openBtn.disabled = false;
  }
}


$('#openDashboard').addEventListener('click', ()=>{
  const sec = $('#dashboard');
  if(!sec) return;
  if(sec.style.display === 'none' || sec.style.display === ''){
    sec.style.display = 'block';
    renderDashboard();
    setTimeout(()=>sec.scrollIntoView({behavior:'smooth'}),80);
  } else {
    sec.style.display = 'none';
  }
});

function openForm(item){
  const f = $('#notebookForm');
  f.reset();
  $('#id').value = item?.id || '';
  $('#formTitle').textContent = item ? 'Editar notebook' : 'Novo notebook';
  if(item){
    for(const k of ['colaborador','email','depto','local','modelo','patrimonio','dataCompra','hostname','empresa','status','prioridade','obs']){
      const el = $('#'+k);
      if(el) el.value = item[k] ?? '';
    }
  } else {
    $('#status').value = 'Ativo';
    $('#prioridade').value = 'Média';
  }
  $('#formDialog').showModal();
}

$('#addBtn').addEventListener('click', ()=>openForm());
document.addEventListener('click', e=>{
  if(e.target.id==='emptyAdd') openForm();
  if(e.target.matches('[data-close]')) e.target.closest('dialog').close();
  const row = e.target.closest('tr[data-id]');
  if(row && e.target.classList.contains('edit-btn')){
    openForm(items.find(i=>i.id===row.dataset.id));
  }
  if(row && e.target.classList.contains('del-btn')){
    const item = items.find(i=>i.id===row.dataset.id);
    if(confirm(`Excluir o registro de "${item.colaborador}"? Esta ação não pode ser desfeita.`)){
      items = items.filter(i=>i.id!==item.id);
      save();
      toast('Registro excluído.');
    }
  }
});

// Inline editing: dblclick a cell with data-key to edit
$('#tableBody').addEventListener('dblclick', e=>{
  const cell = e.target.closest('td[data-key]');
  if(!cell) return;
  const row = cell.closest('tr[data-id]');
  if(!row) return;
  const id = row.dataset.id;
  startInlineEdit(cell, id);
});

function startInlineEdit(cell, id){
  // prevent multiple editors
  if(cell.querySelector('input,select,textarea')) return;
  const key = cell.getAttribute('data-key');
  const item = items.find(i=>i.id===id);
  if(!item) return;

  // choose editor type
  let editor;
  if(key==='status'){
    editor = document.createElement('select');
    for(const s of statuses){ const opt = document.createElement('option'); opt.value=s; opt.textContent=s; if(s===item.status) opt.selected=true; editor.appendChild(opt); }
  } else if(key==='prioridade'){
    editor = document.createElement('select'); ['Alta','Média','Baixa'].forEach(p=>{ const opt=document.createElement('option'); opt.value=p; opt.textContent=p; if(p===item.prioridade) opt.selected=true; editor.appendChild(opt); });
  } else if(key==='obs'){
    editor = document.createElement('textarea'); editor.rows = 2; editor.value = item[key] || '';
  } else {
    editor = document.createElement('input'); editor.type='text'; editor.value = item[key] || '';
  }

  editor.style.width = '100%'; editor.style.boxSizing = 'border-box'; editor.style.padding = '6px';
  const previous = cell.innerHTML;
  cell.innerHTML = ''; cell.appendChild(editor);
  editor.focus(); editor.select && editor.select();

  function commit(){
    let val = editor.value;
    if(key==='prioridade' || key==='status' || key==='empresa' || key==='hostname' || key==='colaborador' || key==='depto' || key==='local' || key==='modelo' || key==='patrimonio') val = String(val).trim();
    item[key] = val;
    save(); // will re-render table and dashboard
    toast('Alteração salva');
  }
  function cancel(){ cell.innerHTML = previous; }

  editor.addEventListener('keydown', ev=>{
    if(ev.key==='Enter'){
      ev.preventDefault(); commit();
    } else if(ev.key==='Escape'){
      ev.preventDefault(); cancel();
    }
  });
  // blur commits
  editor.addEventListener('blur', ()=>{ setTimeout(()=>{ if(document.activeElement!==editor) commit(); },150); });
}


$('#notebookForm').addEventListener('submit', e=>{
  e.preventDefault();
  const id = $('#id').value || (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now());
  const data = { id };
  for(const k of ['colaborador','email','depto','local','modelo','patrimonio','dataCompra','hostname','empresa','status','prioridade','obs']){
    data[k] = $('#'+k).value.trim();
  }
  if(!data.colaborador){ toast('Informe o nome do colaborador.'); return; }
  const existingIndex = items.findIndex(i=>i.id===id);
  if(existingIndex>=0) items[existingIndex] = data; else items.unshift(data);
  save();
  $('#formDialog').close();
  toast(existingIndex>=0 ? 'Registro atualizado.' : 'Notebook cadastrado.');
});

['search','filterStatus','filterPrio'].forEach(id=>{
  $('#'+id).addEventListener('input', renderTable);
  $('#'+id).addEventListener('change', renderTable);
});

$('#exportJson').addEventListener('click', ()=>{
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));
  a.download = 'notebooks-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Backup exportado!');
});

$('#importJson').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw Error();
      if(!confirm(`Importar ${data.length} registros? Isto substituirá os dados atuais.`)) return;
      items = data;
      save();
      toast('Backup restaurado!');
    } catch { alert('Arquivo inválido.'); }
  };
  r.readAsText(file);
});

$('#exportCsv').addEventListener('click', ()=>{
  const headers = ['Colaborador','E-mail','Departamento','Local','Modelo','Patrimônio','Data Compra','Hostname','Empresa/Vínculo','Status','Prioridade','Observações'];
  const rows = items.map(i => [
    i.colaborador, i.email, i.depto, i.local, i.modelo, i.patrimonio,
    i.dataCompra, i.hostname, i.empresa, i.status, i.prioridade, i.obs
  ]);
  const csv = [headers, ...rows].map(row => row.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'notebooks-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('CSV exportado!');
});

// Funções para Excel
function downloadTemplate(){
  const headers = ['Colaborador*','E-mail (UPN)','Departamento','Local','Modelo do notebook','Patrimônio / Serial','Data de compra (AAAA-MM-DD)','Hostname','Empresa/Vínculo','Status','Prioridade','Observações'];
  const sampleData = [
    ['João Silva','joao.silva@empresa.com','TI','Recife/PE','Dell Inspiron 15','NB-001','2023-01-15','nb-001-host','Empresa A','Ativo','Alta','Processa bem'],
    ['Maria Santos','maria@empresa.com','RH','São Paulo/SP','Lenovo ThinkPad','NB-002','2022-06-10','nb-002-host','Empresa B','Aguardando substituição','Média',''],
  ];
  
  const workbook = XLSX.utils.book_new();
  const worksheet = XLSX.utils.aoa_to_sheet([headers, ...sampleData]);
  
  // Estilos e larguras
  worksheet['!cols'] = [
    {wch:20},{wch:22},{wch:15},{wch:18},{wch:18},
    {wch:18},{wch:20},{wch:20},{wch:28},{wch:12},{wch:15},{wch:30}
  ];
  
  // Formatação do cabeçalho
  for(let i=0;i<headers.length;i++){
    const cellRef = XLSX.utils.encode_col(i)+'1';
    if(!worksheet[cellRef]) worksheet[cellRef]={};
    worksheet[cellRef].s={fill:{fgColor:{rgb:'FFF0A6'}},font:{bold:true}};
  }
  
  XLSX.utils.book_append_sheet(workbook, worksheet, 'Notebooks');
  XLSX.writeFile(workbook, 'template-notebooks-'+new Date().toISOString().slice(0,10)+'.xlsx');
  toast('Template baixado!');
}

$('#downloadTemplate').addEventListener('click', downloadTemplate);

$('#importExcel').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = evt => {
    try{
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data,{type:'array'});
      const worksheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(worksheet,{header:1});
      
      if(rows.length<2) throw new Error('Planilha vazia');
      
      const headers = rows[0].map(h=>String(h||'').toLowerCase().trim());
      const colMap = {
        'colaborador':0,'e-mail (upn)':1,'departamento':2,'local':3,'modelo do notebook':4,
        'patrimônio / serial':5,'data de compra (aaaa-mm-dd)':6,'hostname':7,'empresa/vínculo':8,
        'status':9,'prioridade':10,'observações':11
      };
      
      const imported = [];
      for(let i=1;i<rows.length;i++){
        const row = rows[i];
        if(!row[0]) continue; // Pula linhas vazias
        
        const item = {
          id: crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+i,
          colaborador: String(row[0]||'').trim(),
          email: String(row[1]||'').trim(),
          depto: String(row[2]||'').trim(),
          local: String(row[3]||'').trim(),
          modelo: String(row[4]||'').trim(),
          patrimonio: String(row[5]||'').trim(),
          dataCompra: String(row[6]||'').trim(),
          hostname: String(row[7]||'').trim(),
          empresa: String(row[8]||'').trim(),
          status: String(row[9]||'Ativo').trim(),
          prioridade: String(row[10]||'Média').trim(),
          obs: String(row[11]||'').trim()
        };
        
        if(item.colaborador) imported.push(item);
      }
      
      if(!imported.length) throw new Error('Nenhum registro válido encontrado');
      
      if(!confirm(`Importar ${imported.length} notebook(s)? Isto substituirá os dados atuais.`)) return;
      
      items = imported;
      save();
      toast(`${imported.length} notebook(s) importado(s) com sucesso!`);
    } catch(err){
      alert('Erro ao importar planilha: '+err.message);
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

// Renderizar dados iniciais
setTimeout(() => {
  render();
}, 100);
</script>
